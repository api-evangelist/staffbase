aid: staffbase
name: Staffbase
description: >-
  Staffbase is an AI-native employee experience and internal-communications platform
  that connects workforce communications across an intranet, a branded employee mobile
  app, email and newsletters, and an AI-powered knowledge assistant. Used by more than
  1,500 enterprises, it is built to reach hard-to-reach frontline, shift, and distributed
  employees on every channel. Staffbase exposes a Platform API (HTTP Basic auth with an
  API token, base https://app.staffbase.com/api) covering users, groups, news, pages,
  media, notifications, spaces, campaigns, analytics, and audit logs, plus first-party
  Plugins and Custom-Widget SDKs (JavaScript, Node.js, PHP, Java) for embedding apps and
  widgets inside the Staffbase experience. Backed by Insight Partners.
